plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.github.takahirom.roborazzi'
}

android {
    namespace 'com.apexlytics.androiddevice'
    compileSdk 34

    defaultConfig {
        applicationId "com.apexlytics.androiddevice"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

def roborazzi_version = rootProject.ext.roborazzi_version

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi:$roborazzi_version"
    androidTestImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:$roborazzi_version"
}

// ── Snapshot directories ───────────────────────────────────────────────────
// references/ → committed baselines (Git LFS). Updated intentionally via saveReferences.
// images/     → screenshots from the latest test run (gitignored, overwritten each run).
// diffs/      → pixel-diff output when comparison fails (gitignored).

def refsDir   = file("src/test/snapshots/references")
def imagesDir = file("src/test/snapshots/images")
def diffsDir  = file("src/test/snapshots/diffs")

// Pull device-side screenshots to images/ after connected tests complete
task pullScreenshots(type: Exec) {
    doFirst { imagesDir.mkdirs() }
    commandLine 'adb', 'pull',
        '/sdcard/roborazzi-snapshots/.',
        imagesDir.absolutePath
    ignoreExitValue = true
}

// Pixel-diff images/ against references/.
// Saves a 3-panel diff (REFERENCE | DIFF | ACTUAL) to diffs/ and fails the build on mismatch.
task compareScreenshots {
    dependsOn pullScreenshots

    doLast {
        if (!refsDir.exists() || refsDir.listFiles()?.length == 0) {
            println "[compareScreenshots] No references found — run ./gradlew saveReferences first."
            return
        }

        diffsDir.mkdirs()
        boolean failed = false
        int GAP = 4  // pixel gap between the three panels

        imagesDir.listFiles()?.findAll { it.name.endsWith('.png') }?.each { actual ->
            def ref = new File(refsDir, actual.name)
            if (!ref.exists()) {
                println "[NEW] ${actual.name} — no reference yet (run saveReferences to accept)"
                return
            }

            def imgA = javax.imageio.ImageIO.read(actual)
            def imgR = javax.imageio.ImageIO.read(ref)

            if (imgA.width != imgR.width || imgA.height != imgR.height) {
                println "[FAIL] ${actual.name} — size changed ${imgR.width}x${imgR.height} → ${imgA.width}x${imgA.height}"
                failed = true
                return
            }

            int W = imgA.width, H = imgA.height
            long diffPixels = 0

            // Middle panel: red where pixels differ, original colour where they match
            def diffPanel = new java.awt.image.BufferedImage(W, H, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < H; y++) {
                for (int x = 0; x < W; x++) {
                    int ap = imgA.getRGB(x, y)
                    int rp = imgR.getRGB(x, y)
                    if (ap != rp) {
                        diffPixels++
                        diffPanel.setRGB(x, y, 0xFFFF0000.toInteger())
                    } else {
                        diffPanel.setRGB(x, y, ap)
                    }
                }
            }

            def total = (long) W * H
            def pct   = String.format("%.2f", diffPixels * 100.0 / total)

            if (diffPixels > 0) {
                println "[FAIL] ${actual.name} — ${diffPixels} pixels differ (${pct}%)"

                // Build 3-panel image: REFERENCE | DIFF | ACTUAL
                int panelW = W * 3 + GAP * 2
                def composite = new java.awt.image.BufferedImage(panelW, H, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def g = composite.createGraphics()

                // Fill background (dark separator between panels)
                g.setColor(java.awt.Color.DARK_GRAY)
                g.fillRect(0, 0, panelW, H)

                g.drawImage(imgR,    0,            0, null)   // left  — reference
                g.drawImage(diffPanel, W + GAP,    0, null)   // middle — diff
                g.drawImage(imgA,    W * 2 + GAP * 2, 0, null) // right — actual

                // Label each panel
                g.setFont(new java.awt.Font("SansSerif", java.awt.Font.BOLD, 28))
                def labels = ["REFERENCE", "DIFF (${diffPixels}px / ${pct}%)", "ACTUAL"]
                [0, W + GAP, W * 2 + GAP * 2].eachWithIndex { xOff, i ->
                    g.setColor(new java.awt.Color(0, 0, 0, 160))
                    g.fillRect(xOff, 0, W, 40)
                    g.setColor(java.awt.Color.WHITE)
                    g.drawString(labels[i], xOff + 8, 30)
                }
                g.dispose()

                javax.imageio.ImageIO.write(composite, "PNG", new File(diffsDir, actual.name))
                failed = true
            } else {
                println "[PASS] ${actual.name}"
            }
        }

        if (failed) {
            throw new GradleException("Screenshot comparison failed. Check diffs at: ${diffsDir.absolutePath}")
        }
    }
}

// Copy images/ → references/ to accept current screenshots as new baselines
task saveReferences(type: Copy) {
    description "Accept current screenshots as the new baseline for comparison"
    from imagesDir
    into refsDir
    include '**/*.png'
}

afterEvaluate {
    tasks.findByName('connectedDebugAndroidTest')?.finalizedBy(pullScreenshots)
    pullScreenshots.finalizedBy(compareScreenshots)
}
